<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委外廠商製作進度追蹤表 (雲端進階版)</title>
  <!-- 引入 SheetJS、JSZip 與 Chart.js 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .user-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .sheet-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .sheet-tab.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .sheet-close {
      font-size: 0.75rem;
      opacity: 0.7;
      cursor: pointer;
    }
    .sheet-close:hover { color: #f87171; opacity: 1; }

    .tab-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background-color: var(--card-bg);
      border-radius: 0 0 8px 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }
    .btn-success { background-color: #059669; color: #fff; border: none; }
    .btn-success:hover { background-color: #047857; color: #fff; }
    .btn-warning { background-color: #d97706; color: #fff; border: none; }
    .btn-warning:hover { background-color: #b45309; color: #fff; }
    .btn-danger { background-color: var(--danger); color: #fff; border: none; }
    .btn-danger:hover { background-color: #dc2626; color: #fff; }

    .table-scroll-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
      cursor: move;
    }

    th.dragging, tr.dragging {
      opacity: 0.5;
      background-color: #334155;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      margin-right: 8px;
      font-weight: bold;
    }

    .col-delete-btn {
      margin-left: 6px;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.75rem;
      opacity: 0.6;
      display: inline-block;
      padding: 0 4px;
    }
    .col-delete-btn:hover {
      opacity: 1;
      font-weight: bold;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
      vertical-align: middle;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }
    .text-center { text-align: center; }
    .editable { cursor: pointer; }
    .editable:hover { outline: 1px dashed var(--accent); }

    .product-img-preview {
      max-width: 50px;
      max-height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 8px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-large {
      width: 700px;
      max-width: 90vw;
    }
    .modal input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <div>
          <span class="badge-pro">OUTSOURCING TRACKER (CLOUD)</span>
          <h1>委外廠商製作進度追蹤</h1>
        </div>
      </div>
      <div class="user-control">
        <span id="user-status-text" style="font-size: 0.9rem; color: var(--text-muted);">權限：訪客 (唯讀)</span>
        <button id="auth-btn" class="btn btn-primary" onclick="toggleAuth()">管理員登入</button>
      </div>
    </header>

    <div class="sheet-bar">
      <div id="sheets-container" style="display: flex; gap: 6px;"></div>
      <button class="btn" style="padding: 2px 8px; font-size: 0.8rem;" onclick="addSheet()">+ 新增列表</button>
      <button class="btn" style="padding: 2px 8px; font-size: 0.8rem;" onclick="copySheet()">複製列表</button>
    </div>

    <div class="tab-content">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="addRow()">+ 新增項目</button>
        <button class="btn" onclick="addColumn()">+ 新增欄位</button>
        <button class="btn btn-success" onclick="triggerExcelImport()">📥 匯入 Excel</button>
        <button class="btn btn-success" onclick="triggerCSVImport()">📥 匯入 CSV</button>
        <button class="btn btn-warning" onclick="exportCSV()">📤 匯出 CSV</button>
        <button class="btn btn-primary" style="background-color: #8b5cf6;" onclick="openAnalysisModal()">📊 廠商進度分析</button>
        <button class="btn btn-danger" onclick="clearAllData()">🧹 清除所有資訊</button>
        <span id="sync-status" style="font-size: 0.8rem; color: var(--accent); margin-left: auto;">☁️ 雲端載入中...</span>
      </div>

      <div class="table-scroll-container">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <input type="file" id="image-file-input" accept="image/*" style="display: none;">
  <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;">
  <input type="file" id="csv-file-input" accept=".csv" style="display: none;">

  <!-- 登入 Modal -->
  <div id="login-modal" class="modal-backdrop">
    <div class="modal">
      <h3 style="margin: 0; color: var(--accent);">管理員登入</h3>
      <input type="text" id="username" placeholder="請輸入帳號">
      <input type="password" id="password" placeholder="請輸入密碼">
      <button class="btn btn-primary" onclick="login()">登入</button>
      <button class="btn" onclick="closeLoginModal()">取消</button>
    </div>
  </div>

  <!-- 分析圖表 Modal -->
  <div id="analysis-modal" class="modal-backdrop">
    <div class="modal modal-large">
      <h3 style="margin: 0; color: var(--accent);">📊 委外廠商進度與完成率分析</h3>
      <div style="display: flex; gap: 16px; min-height: 300px; justify-content: center; align-items: center;">
        <div style="flex: 1; height: 300px;"><canvas id="vendorStatusChart"></canvas></div>
      </div>
      <button class="btn" onclick="closeAnalysisModal()">關閉分析</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCBjRDPe9vxXh_vVcqi2Oj4_GQLHycHEso",
      authDomain: "outsourcemfg-59ca8.firebaseapp.com",
      projectId: "outsourcemfg-59ca8",
      storageBucket: "outsourcemfg-59ca8.firebasestorage.app",
      messagingSenderId: "408387263887",
      appId: "1:408387263887:web:17f80ca6c5263610cfbffa",
      measurementId: "G-XH421GGFC9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const DOC_REF = doc(db, "outsourcing_tracker", "main_data");

    const defaultColumns = [
      { key: "no", label: "No." },
      { key: "productImg", label: "產品圖面" },
      { key: "img", label: "示意圖" },
      { key: "itemNo", label: "品號" },
      { key: "itemName", label: "品名" },
      { key: "vendor", label: "廠商" },
      { key: "faiAssignDate", label: "FAI派工日期" },
      { key: "faiPassDate", label: "FAI合格日期" },
      { key: "note1", label: "加工或備註" },
      { key: "note2", label: "二次加工備註" },
      { key: "reason", label: "未入庫原因" },
      { key: "status", label: "發單/追蹤狀況" }
    ];

    const initialData = [
      { no: 1, productImg: "", img: "📐", itemNo: "10091-VWNE000", itemName: "FVSE-0036-4", vendor: "廠商A", faiAssignDate: "2024-03-01", faiPassDate: "2024-03-05", note1: "50001-111", note2: "", reason: "", status: "已完成入庫" },
      { no: 2, productImg: "", img: "📐", itemNo: "10021-VWNE000", itemName: "FVSE-0525-4 治具", vendor: "廠商B", faiAssignDate: "2024-03-10", faiPassDate: "", note1: "50001-112", note2: "", reason: "缺料延遲", status: "加工中" }
    ];

    let isLoggedIn = false;
    let currentEditImageTarget = null;
    let workbook = [
      { id: "sheet_1", name: "工程及製造追蹤項目", columns: defaultColumns, data: initialData }
    ];
    let activeSheetId = "sheet_1";
    let myChart = null;

    function parseExcelDate(val) {
      if (val === undefined || val === null || val === "") return "";
      
      if (typeof val === 'string' && (val.includes('-') || val.includes('/'))) {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          return d.toISOString().split('T')[0];
        }
      }

      const num = Number(val);
      if (!isNaN(num) && num > 20000 && num < 60000) {
        const excelEpoch = new Date(1899, 11, 30);
        const dateObj = new Date(excelEpoch.getTime() + num * 86400000);
        return dateObj.toISOString().split('T')[0];
      }

      return String(val);
    }

    async function saveData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "☁️ 同步至雲端中...";
      try {
        await setDoc(DOC_REF, {
          workbook: workbook,
          activeSheetId: activeSheetId,
          updatedAt: new Date().toISOString()
        });
        statusEl.innerText = "✅ 已同步雲端";
      } catch (e) {
        console.error("雲端儲存失敗：", e);
        statusEl.innerText = "❌ 雲端同步失敗";
      }
    }

    async function loadDataFromCloud() {
      const statusEl = document.getElementById('sync-status');
      try {
        const docSnap = await getDoc(DOC_REF);
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          workbook = cloudData.workbook || workbook;
          activeSheetId = cloudData.activeSheetId || workbook[0].id;
          statusEl.innerText = "✅ 雲端資料載入完成";
        } else {
          await saveData();
          statusEl.innerText = "✅ 建立雲端預設資料";
        }
      } catch (e) {
        console.error("雲端讀取失敗：", e);
        statusEl.innerText = "⚠️ 載入失敗 (請檢查金鑰)";
      }
      renderSheets();
      renderTable();
    }

    function getActiveSheet() {
      return workbook.find(s => s.id === activeSheetId) || workbook[0];
    }

    function checkAuth() {
      if (!isLoggedIn) {
        alert("權限不足：請先點擊右上角「管理員登入」進行登入！");
        return false;
      }
      return true;
    }

    window.toggleAuth = function() {
      if (isLoggedIn) {
        isLoggedIn = false;
        document.getElementById('user-status-text').innerText = "權限：訪客 (唯讀)";
        document.getElementById('auth-btn').innerText = "管理員登入";
        alert("已成功登出");
      } else {
        document.getElementById('login-modal').style.display = 'flex';
      }
    };

    window.closeLoginModal = function() {
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    };

    window.login = function() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      if (user === 'n1693131@gmail.com' && pass === 'Breakheart1a') {
        isLoggedIn = true;
        document.getElementById('user-status-text').innerText = "權限：管理員 (可編輯)";
        document.getElementById('auth-btn').innerText = "登出";
        closeLoginModal();
      } else {
        alert("帳號或密碼錯誤！");
      }
    };

    window.clearAllData = function() {
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      if (sheet.data.length === 0) {
        alert("當前列表中沒有資料可供清除！");
        return;
      }
      if (confirm(`警告：確定要清空「${sheet.name}」中的所有表格資料嗎？此操作無法撤銷！`)) {
        sheet.data = [];
        saveData();
        renderTable();
        alert("資料已成功清空並同步！");
      }
    };

    function renderSheets() {
      const container = document.getElementById('sheets-container');
      container.innerHTML = '';
      workbook.forEach(sheet => {
        const tab = document.createElement('div');
        tab.className = `sheet-tab ${sheet.id === activeSheetId ? 'active' : ''}`;
        tab.innerHTML = `
          <span ondblclick="renameSheet('${sheet.id}')">${sheet.name}</span>
          ${workbook.length > 1 ? `<span class="sheet-close" onclick="deleteSheet('${sheet.id}', event)">✕</span>` : ''}
        `;
        tab.onclick = (e) => {
          if (e.target.classList.contains('sheet-close')) return;
          activeSheetId = sheet.id;
          saveData();
          renderSheets();
          renderTable();
        };
        container.appendChild(tab);
      });
    }

    window.addSheet = function() {
      if (!checkAuth()) return;
      const newId = 'sheet_' + Date.now();
      const newSheet = {
        id: newId,
        name: `新列表 ${workbook.length + 1}`,
        columns: JSON.parse(JSON.stringify(defaultColumns)),
        data: []
      };
      workbook.push(newSheet);
      activeSheetId = newId;
      saveData();
      renderSheets();
      renderTable();
    };

    window.copySheet = function() {
      if (!checkAuth()) return;
      const current = getActiveSheet();
      const newId = 'sheet_' + Date.now();
      workbook.push({
        id: newId,
        name: `${current.name} (副本)`,
        columns: JSON.parse(JSON.stringify(current.columns)),
        data: JSON.parse(JSON.stringify(current.data))
      });
      activeSheetId = newId;
      saveData();
      renderSheets();
      renderTable();
    };

    window.renameSheet = function(sheetId) {
      if (!checkAuth()) return;
      const sheet = workbook.find(s => s.id === sheetId);
      const newName = prompt("請輸入列表名稱：", sheet.name);
      if (newName) {
        sheet.name = newName.trim();
        saveData();
        renderSheets();
      }
    };

    window.deleteSheet = function(sheetId, e) {
      e.stopPropagation();
      if (!checkAuth()) return;
      if (workbook.length <= 1) return;
      if (confirm("確定要刪除此列表嗎？")) {
        workbook = workbook.filter(s => s.id !== sheetId);
        if (activeSheetId === sheetId) activeSheetId = workbook[0].id;
        saveData();
        renderSheets();
        renderTable();
      }
    };

    function isImageUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const trimmed = url.trim().toLowerCase();
      return trimmed.startsWith('data:image') || trimmed.startsWith('http://') || trimmed.startsWith('https://');
    }

    function renderTable() {
      const sheet = getActiveSheet();
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      let headHtml = '<tr><th style="width: 40px; text-align:center;">拖拖</th>';
      sheet.columns.forEach((col, index) => {
        headHtml += `
          <th draggable="true" data-col-idx="${index}" class="editable" ondblclick="renameColumn(${index})">
            ${col.label}
            <span class="col-delete-btn" title="刪除此欄位" onclick="deleteColumn(${index}, event)">✕</span>
          </th>`;
      });
      headHtml += `<th class="text-center">操作</th></tr>`;
      thead.innerHTML = headHtml;

      tbody.innerHTML = '';
      sheet.data.forEach((row, rowIndex) => {
        const tr = document.createElement('tr');
        tr.draggable = true;
        tr.dataset.rowIdx = rowIndex;

        let bodyHtml = `<td class="drag-handle text-center">⋮⋮</td>`;
        sheet.columns.forEach(col => {
          const val = row[col.key] !== undefined ? row[col.key] : '';
          
          if (col.key === 'productImg' || isImageUrl(val)) {
            const imgDisplay = isImageUrl(val) 
              ? `<img src="${val.trim()}" class="product-img-preview" alt="圖面" onerror="this.onerror=null; this.parentElement.innerHTML='<span style=\\'color:var(--danger); font-size:0.8rem;\\'>圖片連結失效</span>';">` 
              : `<span style="color:var(--text-muted); font-size:0.8rem;">+ 上傳/設定圖片</span>`;
            bodyHtml += `<td class="editable text-center" ondblclick="editProductImage(${rowIndex}, '${col.key}')">${imgDisplay}</td>`;
          } else {
            bodyHtml += `<td class="editable" ondblclick="editCell(${rowIndex}, '${col.key}')">${val}</td>`;
          }
        });
        bodyHtml += `<td class="text-center"><button class="btn btn-danger" style="padding: 2px 8px; font-size: 0.75rem;" onclick="deleteRow(${rowIndex})">刪除</button></td>`;
        tr.innerHTML = bodyHtml;
        tbody.appendChild(tr);
      });

      bindDragEvents();
    }

    function bindDragEvents() {
      const sheet = getActiveSheet();

      let dragColIdx = null;
      document.querySelectorAll('th[draggable="true"]').forEach(th => {
        th.addEventListener('dragstart', (e) => {
          dragColIdx = parseInt(e.target.dataset.colIdx);
          e.target.classList.add('dragging');
        });
        th.addEventListener('dragover', (e) => e.preventDefault());
        th.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetTh = e.target.closest('th');
          if (!targetTh || targetTh.dataset.colIdx === undefined) return;
          const dropColIdx = parseInt(targetTh.dataset.colIdx);
          if (dragColIdx !== null && dragColIdx !== dropColIdx) {
            const movedCol = sheet.columns.splice(dragColIdx, 1)[0];
            sheet.columns.splice(dropColIdx, 0, movedCol);
            saveData();
            renderTable();
          }
        });
        th.addEventListener('dragend', (e) => e.target.classList.remove('dragging'));
      });

      let dragRowIdx = null;
      document.querySelectorAll('tbody tr').forEach(tr => {
        tr.addEventListener('dragstart', (e) => {
          dragRowIdx = parseInt(e.currentTarget.dataset.rowIdx);
          e.currentTarget.classList.add('dragging');
        });
        tr.addEventListener('dragover', (e) => e.preventDefault());
        tr.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetTr = e.target.closest('tr');
          if (!targetTr || targetTr.dataset.rowIdx === undefined) return;
          const dropRowIdx = parseInt(targetTr.dataset.rowIdx);
          if (dragRowIdx !== null && dragRowIdx !== dropRowIdx) {
            const movedRow = sheet.data.splice(dragRowIdx, 1)[0];
            sheet.data.splice(dropRowIdx, 0, movedRow);
            saveData();
            renderTable();
          }
        });
        tr.addEventListener('dragend', (e) => e.currentTarget.classList.remove('dragging'));
      });
    }

    window.exportCSV = function() {
      const sheet = getActiveSheet();
      if (!sheet.data || sheet.data.length === 0) {
        alert("當前列表無資料可供匯出！");
        return;
      }

      let csvContent = "\uFEFF";
      const headers = sheet.columns.map(c => `"${c.label.replace(/"/g, '""')}"`);
      csvContent += headers.join(",") + "\r\n";

      sheet.data.forEach(row => {
        const rowArr = sheet.columns.map(c => {
          const val = row[c.key] !== undefined ? String(row[c.key]) : "";
          return `"${val.replace(/"/g, '""')}"`;
        });
        csvContent += rowArr.join(",") + "\r\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `${sheet.name}_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.triggerCSVImport = function() {
      if (!checkAuth()) return;
      document.getElementById('csv-file-input').click();
    };

    document.getElementById('csv-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        const lines = text.split(/\r\n|\n/);
        if (lines.length === 0) return;

        const parseCSVLine = (line) => {
          const result = [];
          let insideQuote = false;
          let entry = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
              if (insideQuote && line[i+1] === '"') { entry += '"'; i++; }
              else { insideQuote = !insideQuote; }
            } else if (char === ',' && !insideQuote) {
              result.push(entry.trim());
              entry = '';
            } else { entry += char; }
          }
          result.push(entry.trim());
          return result;
        };

        const headers = parseCSVLine(lines[0]);
        const newColumns = headers.map((h, i) => {
          const name = String(h || '').trim();
          let key = `col_${i}`;
          if (name.includes("FAI") && name.includes("派工")) key = "faiAssignDate";
          else if (name.includes("FAI") && name.includes("合格")) key = "faiPassDate";
          else if (name.includes("廠商") || name.includes("委外") || name.toLowerCase().includes("vendor") || name.toLowerCase().includes("supplier")) key = "vendor";
          else if (name.includes("品號")) key = "itemNo";
          else if (name.includes("品名")) key = "itemName";
          return { key: key, label: name || `欄位${i+1}` };
        });

        const newData = [];
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const rowValues = parseCSVLine(lines[i]);
          const rowObj = {};
          newColumns.forEach((col, idx) => {
            let val = rowValues[idx] || "";
            if (col.label.includes("日期") || col.label.includes("日") || col.label.includes("FAI")) {
              val = parseExcelDate(val);
            }
            rowObj[col.key] = val;
          });
          newData.push(rowObj);
        }

        const sheet = getActiveSheet();
        sheet.columns = newColumns;
        sheet.data = newData;
        saveData();
        renderTable();
        alert("CSV 匯入完成！");
      };
      reader.readAsText(file, 'utf-8');
      this.value = '';
    });

    // Excel 匯入功能 (修復廠商與相關欄位對應問題)
    window.triggerExcelImport = function() {
      if (!checkAuth()) return;
      document.getElementById('excel-file-input').click();
    };

    document.getElementById('excel-file-input').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const arrayBuffer = await file.arrayBuffer();
        const wb = XLSX.read(arrayBuffer, { type: 'array', cellDates: true });
        const firstSheetName = wb.SheetNames[0];
        const worksheet = wb.Sheets[firstSheetName];
        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

        if (!jsonRows || jsonRows.length === 0) return;

        const headerRow = jsonRows[0] || [];
        const newColumns = headerRow.map((colName, index) => {
          const name = String(colName || '').trim();
          let key = `col_${index}`;
          
          // 擴充廠商欄位辨識關鍵字 (支援廠商, 委外, Vendor, Supplier 等)
          if (name.includes("FAI") && name.includes("派工")) key = "faiAssignDate";
          else if (name.includes("FAI") && name.includes("合格")) key = "faiPassDate";
          else if (name.includes("品號")) key = "itemNo";
          else if (name.includes("品名")) key = "itemName";
          else if (name.includes("廠商") || name.includes("委外") || name.toLowerCase().includes("vendor") || name.toLowerCase().includes("supplier")) key = "vendor";
          else if (name.includes("狀態") || name.includes("進度")) key = "status";
          
          return { key: key, label: name || `欄位${index+1}` };
        });

        const newData = [];
        for (let i = 1; i < jsonRows.length; i++) {
          const rowData = jsonRows[i];
          if (!rowData || rowData.length === 0) continue;
          const rowObj = {};
          newColumns.forEach((col, cIdx) => {
            let val = rowData[cIdx] !== undefined && rowData[cIdx] !== null ? rowData[cIdx] : "";
            if (col.label.includes("日期") || col.label.includes("日") || col.label.includes("FAI")) {
              val = parseExcelDate(val);
            } else {
              val = String(val).trim();
            }
            rowObj[col.key] = val;
          });
          newData.push(rowObj);
        }

        const currentSheet = getActiveSheet();
        currentSheet.columns = newColumns.length > 0 ? newColumns : defaultColumns;
        currentSheet.data = newData;

        saveData();
        renderTable();
        alert("Excel 檔案已成功匯入！");
      } catch (err) {
        console.error(err);
        alert("匯入失敗，請確認檔案格式。");
      } finally {
        this.value = '';
      }
    });

    window.openAnalysisModal = function() {
      document.getElementById('analysis-modal').style.display = 'flex';
      renderChart();
    };

    window.closeAnalysisModal = function() {
      document.getElementById('analysis-modal').style.display = 'none';
    };

    function renderChart() {
      const sheet = getActiveSheet();
      const vendorStats = {};

      sheet.data.forEach(row => {
        const vendor = row.vendor || "未指定廠商";
        const status = row.status || "未完成";

        if (!vendorStats[vendor]) {
          vendorStats[vendor] = { total: 0, completed: 0 };
        }
        vendorStats[vendor].total += 1;
        if (status.includes("完成") || status.includes("已入庫") || status.includes("結案")) {
          vendorStats[vendor].completed += 1;
        }
      });

      const labels = Object.keys(vendorStats);
      const totalData = labels.map(l => vendorStats[l].total);
      const completedData = labels.map(l => vendorStats[l].completed);

      const ctx = document.getElementById('vendorStatusChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: '總發單件數', data: totalData, backgroundColor: '#38bdf8' },
            { label: '已完成件數', data: completedData, backgroundColor: '#34d399' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: { display: true, color: '#f8fafc', text: '各廠商製作進度與完成統計' },
            legend: { labels: { color: '#f8fafc' } }
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' }, beginAtZero: true }
          }
        }
      });
    }

    window.renameColumn = function(colIndex) {
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      const oldLabel = sheet.columns[colIndex].label;
      const newLabel = prompt("請輸入新的欄位名稱：", oldLabel);
      if (newLabel !== null && newLabel.trim() !== "") {
        sheet.columns[colIndex].label = newLabel.trim();
        saveData();
        renderTable();
      }
    };

    window.deleteColumn = function(colIndex, e) {
      if (e) e.stopPropagation();
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      if (confirm(`確定要刪除欄位「${sheet.columns[colIndex].label}」嗎？`)) {
        sheet.columns.splice(colIndex, 1);
        saveData();
        renderTable();
      }
    };

    window.editProductImage = function(rowIndex, colKey = 'productImg') {
      if (!checkAuth()) return;
      currentEditImageTarget = { rowIndex, colKey };
      const sheet = getActiveSheet();
      const currentVal = sheet.data[rowIndex][colKey] || '';
      const choice = prompt("請選擇圖片來源：\n1. 輸入 1 選擇本機圖片檔上傳\n2. 直接貼上圖片網址 (URL)\n3. 輸入 0 清除圖片", currentVal || "1");
      
      if (choice === "1") {
        document.getElementById('image-file-input').click();
      } else if (choice === "0") {
        sheet.data[rowIndex][colKey] = "";
        saveData();
        renderTable();
      } else if (choice && choice.trim() !== "") {
        sheet.data[rowIndex][colKey] = choice.trim();
        saveData();
        renderTable();
      }
    };

    document.getElementById('image-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && currentEditImageTarget !== null) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const sheet = getActiveSheet();
          const { rowIndex, colKey } = currentEditImageTarget;
          sheet.data[rowIndex][colKey] = evt.result;
          saveData();
          renderTable();
          currentEditImageTarget = null;
        };
        reader.readAsDataURL(file);
      }
      this.value = '';
    });

    window.editCell = function(rowIndex, colKey) {
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      const oldVal = sheet.data[rowIndex][colKey] || '';
      const newVal = prompt("請輸入修改內容：", oldVal);
      if (newVal !== null) {
        sheet.data[rowIndex][colKey] = newVal.trim();
        saveData();
        renderTable();
      }
    };

    window.addRow = function() {
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      const newRow = { no: sheet.data.length + 1, productImg: "", img: "📐" };
      sheet.columns.forEach(col => {
        if (!newRow[col.key]) newRow[col.key] = "-";
      });
      sheet.data.push(newRow);
      saveData();
      renderTable();
    };

    window.addColumn = function() {
      if (!checkAuth()) return;
      const colName = prompt("請輸入新欄位名稱：");
      if (colName) {
        const sheet = getActiveSheet();
        const key = 'custom_' + Date.now();
        sheet.columns.push({ key: key, label: colName });
        saveData();
        renderTable();
      }
    };

    window.deleteRow = function(rowIndex) {
      if (!checkAuth()) return;
      const sheet = getActiveSheet();
      if (confirm("確定刪除此列嗎？")) {
        sheet.data.splice(rowIndex, 1);
        saveData();
        renderTable();
      }
    };

    loadDataFromCloud();
  </script>
