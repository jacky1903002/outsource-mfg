<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委外廠商製作進度追蹤表 (專業商業版)</title>
  <!-- 引入 SheetJS, JSZip, Chart.js, Chart.js DataLabels 與 html2canvas 套件 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  
  <style>
    :root {
      /* 專業商業微淺色系：完美適配簡報PPT，視覺清爽高雅 */
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --table-header-bg: #e2e8f0;
      --table-hover: #f8fafc;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
    }

    .last-update-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .user-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheet-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .sheet-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color);
      user-select: none;
      transition: all 0.2s;
    }

    .sheet-tab:hover {
      color: var(--accent);
      background: #f8fafc;
    }

    .sheet-tab.active {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.2);
    }

    .tab-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background-color: var(--card-bg);
      border-radius: 0 0 8px 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border-color);
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); background: #f8fafc; }
    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }
    .btn-success { background-color: #059669; color: #fff; border: none; }
    .btn-success:hover { background-color: #047857; color: #fff; }
    .btn-purple { background-color: #7c3aed; color: #fff; border: none; }
    .btn-purple:hover { background-color: #6d28d9; color: #fff; }

    .table-scroll-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      background-color: var(--table-header-bg);
      color: #334155;
      font-weight: 700;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      white-space: nowrap;
    }

    tbody tr:hover {
      background-color: var(--table-hover);
    }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-large {
      width: 1000px;
      max-width: 95vw;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .chart-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-tabs-bar {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .chart-tab-btn {
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chart-tab-btn:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    .chart-tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chart-page {
      display: none;
      height: 450px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex-direction: column;
    }

    .chart-page.active {
      display: flex;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app-main-container">
    <header>
      <div class="brand-title">
        <div>
          <span class="badge-pro">ENTERPRISE EDITION (PRO)</span>
          <h1>
            委外廠商製作進度追蹤表
            <span class="last-update-tag" id="last-updated-time">最後更新：載入中...</span>
          </h1>
        </div>
      </div>
      <div class="user-control">
        <span id="user-status-text" style="font-size: 0.9rem; color: var(--text-muted);">權限：訪客 (唯讀)</span>
        <button id="auth-btn" class="btn btn-primary" onclick="toggleAuth()">管理員登入</button>
      </div>
    </header>

    <div class="sheet-bar">
      <div id="sheets-container" style="display: flex; gap: 6px;"></div>
    </div>

    <div class="tab-content">
      <div class="toolbar">
        <button class="btn btn-purple" onclick="openAnalysisModal()">📊 衛星工廠進度追蹤</button>
        <button id="export-roadmap-btn" class="btn btn-primary" style="display: none;" onclick="exportCapacityRoadmapPNG()">🖼️ 匯出 Capacity Roadmap PNG</button>
        <button class="btn btn-success" onclick="exportToExcel()">📥 匯出 Excel</button>
        <button class="btn" onclick="document.getElementById('import-excel-input').click()">📤 匯入 Excel</button>
        <input type="file" id="import-excel-input" accept=".xlsx, .xls" style="display: none;" onchange="importFromExcel(event)" />
        
        <span id="sync-status" style="font-size: 0.8rem; color: var(--accent); margin-left: auto; font-weight: 600;">☁️ 雲端載入中...</span>
      </div>

      <div class="table-scroll-container" id="table-scroll-area">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 分析圖表 Modal -->
  <div id="analysis-modal" class="modal-backdrop">
    <div class="modal-large">
      <div class="chart-modal-header">
        <h3 style="margin: 0; color: #0f172a; font-size: 1.3rem;">📊 衛星工廠進度追蹤分析</h3>
        <button class="btn btn-success" onclick="exportAllChartsCombined()">🖼️ 一鍵匯出所有圖表 (6合1)</button>
      </div>
      
      <div class="chart-tabs-bar">
        <button class="chart-tab-btn active" onclick="switchChartPage('page-vendor-count', this)">1. FAI合格已派工-件數</button>
        <button class="chart-tab-btn" onclick="switchChartPage('page-vendor-pcs', this)">2. FAI合格已派工-已交貨PCS</button>
        <button class="chart-tab-btn" onclick="switchChartPage('page-fai-pending', this)">3. FAI待驗證-件數</button>
        <button class="chart-tab-btn" onclick="switchChartPage('page-daily-count', this)">4. FAI已派工逐日累積件數</button>
        <button class="chart-tab-btn" onclick="switchChartPage('page-daily-pcs', this)">5. FAI已派工逐日累積PCS數</button>
        <button class="chart-tab-btn" onclick="switchChartPage('page-fai-pending-daily', this)">6. FAI待驗證逐日累積件數</button>
      </div>

      <!-- 頁面 1: FAI合格已派工 - 件數 -->
      <div id="page-vendor-count" class="chart-page active">
        <div style="flex: 1; min-height: 0;"><canvas id="vendorCountChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('vendorCountChart', '1. FAI合格已派工-件數')">🖼️ 匯出 PNG</button>
      </div>

      <!-- 頁面 2: FAI合格已派工 - 已交貨 PCS -->
      <div id="page-vendor-pcs" class="chart-page">
        <div style="flex: 1; min-height: 0;"><canvas id="vendorPcsChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('vendorPcsChart', '2. FAI合格已派工-已交貨PCS')">🖼️ 匯出 PNG</button>
      </div>

      <!-- 頁面 3: FAI待驗證 - 件數 -->
      <div id="page-fai-pending" class="chart-page">
        <div style="flex: 1; min-height: 0;"><canvas id="faiPendingChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('faiPendingChart', '3. FAI待驗證-件數')">🖼️ 匯出 PNG</button>
      </div>

      <!-- 頁面 4: FAI已派工逐日累積件數 -->
      <div id="page-daily-count" class="chart-page">
        <div style="flex: 1; min-height: 0;"><canvas id="dailyCountChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('dailyCountChart', '4. FAI已派工逐日累積件數')">🖼️ 匯出 PNG</button>
      </div>

      <!-- 頁面 5: FAI已派工逐日累積PCS數 -->
      <div id="page-daily-pcs" class="chart-page">
        <div style="flex: 1; min-height: 0;"><canvas id="dailyPcsChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('dailyPcsChart', '5. FAI已派工逐日累積PCS數')">🖼️ 匯出 PNG</button>
      </div>

      <!-- 頁面 6: FAI待驗證逐日累積件數 -->
      <div id="page-fai-pending-daily" class="chart-page">
        <div style="flex: 1; min-height: 0;"><canvas id="faiPendingDailyChart"></canvas></div>
        <button class="btn btn-primary" style="margin-top: 8px; align-self: flex-end;" onclick="exportChartImage('faiPendingDailyChart', '6. FAI待驗證逐日累積件數')">🖼️ 匯出 PNG</button>
      </div>

      <button class="btn" style="margin-top: 6px; align-self: flex-end;" onclick="closeAnalysisModal()">關閉分析</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    if (typeof ChartDataLabels !== 'undefined') {
      Chart.register(ChartDataLabels);
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCBjRDPe9vxXh_vVcqi2Oj4_GQLHycHEso",
      authDomain: "outsourcemfg-59ca8.firebaseapp.com",
      projectId: "outsourcemfg-59ca8",
      storageBucket: "outsourcemfg-59ca8.firebasestorage.app",
      messagingSenderId: "408387263887",
      appId: "1:408387263887:web:17f80ca6c5263610cfbffa"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const DOC_REF = doc(db, "outsourcing_tracker", "main_data");

    let isAdmin = false;

    window.toggleAuth = function() {
      if (!isAdmin) {
        const pwd = prompt("請輸入管理員密碼：");
        if (pwd === "admin888") {
          isAdmin = true;
          document.getElementById('user-status-text').innerText = "權限：管理員 (可編輯)";
          document.getElementById('user-status-text').style.color = "#059669";
          document.getElementById('auth-btn').innerText = "登出管理員";
          alert("登入成功！已開啟管理員權限。");
        } else if (pwd !== null) {
          alert("密碼錯誤！");
        }
      } else {
        isAdmin = false;
        document.getElementById('user-status-text').innerText = "權限：訪客 (唯讀)";
        document.getElementById('user-status-text').style.color = "var(--text-muted)";
        document.getElementById('auth-btn').innerText = "管理員登入";
        alert("已成功登出。");
      }
    };

    const defaultColumns = [
      { key: "no", label: "No." },
      { key: "itemNo", label: "品號" },
      { key: "itemName", label: "品名" },
      { key: "vendor", label: "廠商" },
      { key: "faiAssignDate", label: "FAI派工日期" },
      { key: "faiPassDate", label: "FAI合格日期" },
      { key: "deliveredPcs", label: "已交貨(PCS)" },
      { key: "faiPendingVendor", label: "FAI 待驗證廠商" },
      { key: "status", label: "發單/追蹤狀況" }
    ];

    let workbook = [
      { id: "sheet_roadmap", name: "Capacity Roadmap圖鑑表", columns: defaultColumns, data: [] },
      { id: "sheet_1", name: "工程及製造追蹤項目", columns: defaultColumns, data: [] }
    ];
    let activeSheetId = "sheet_roadmap";
    let chartInstances = {};

    async function saveData() {
      const statusEl = document.getElementById('sync-status');
      const nowStr = new Date().toLocaleString('zh-TW');
      statusEl.innerText = "☁️ 同步至雲端中...";
      try {
        await setDoc(DOC_REF, {
          workbook: workbook,
          activeSheetId: activeSheetId,
          updatedAt: nowStr
        });
        statusEl.innerText = "✅ 已同步雲端";
        document.getElementById('last-updated-time').innerText = `最後更新：${nowStr}`;
      } catch (e) {
        console.error(e);
        statusEl.innerText = "❌ 雲端同步失敗";
      }
    }

    async function loadDataFromCloud() {
      const statusEl = document.getElementById('sync-status');
      try {
        const docSnap = await getDoc(DOC_REF);
        if (docSnap.exists()) {
          const cloudData = docSnap.data();
          workbook = cloudData.workbook || workbook;
          activeSheetId = cloudData.activeSheetId || workbook[0].id;
          const updatedAt = cloudData.updatedAt || new Date().toLocaleString('zh-TW');
          document.getElementById('last-updated-time').innerText = `最後更新：${updatedAt}`;
          statusEl.innerText = "✅ 雲端資料載入完成";
        }
      } catch (e) {
        console.error(e);
        statusEl.innerText = "⚠️ 載入失敗";
      }
      renderSheets();
      renderTable();
      checkRoadmapBtnVisibility();
    }

    function getActiveSheet() {
      return workbook.find(s => s.id === activeSheetId) || workbook[0];
    }

    window.exportToExcel = function() {
      const sheet = getActiveSheet();
      const exportData = sheet.data.map(row => {
        let mapped = {};
        sheet.columns.forEach(col => { mapped[col.label] = row[col.key] || ""; });
        return mapped;
      });

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, worksheet, sheet.name);
      XLSX.writeFile(wb, `${sheet.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
    };

    window.importFromExcel = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const readWb = XLSX.read(data, { type: 'array' });
        const firstSheetName = readWb.SheetNames[0];
        const worksheet = readWb.Sheets[firstSheetName];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);

        const currentSheet = getActiveSheet();
        currentSheet.data = jsonData.map(item => {
          let newRow = {};
          currentSheet.columns.forEach(col => {
            newRow[col.key] = item[col.label] || item[col.key] || "";
          });
          return newRow;
        });

        renderTable();
        saveData();
        alert("Excel 匯入成功！");
      };
      reader.readAsArrayBuffer(file);
    };

    // 第一個工作表專屬：一鍵匯出 Capacity Roadmap PNG
    window.exportCapacityRoadmapPNG = function() {
      const targetArea = document.querySelector('.tab-content');
      if (!targetArea) return;

      // 暫時隱藏不需要出現在截圖裡的工具列按鈕，保持乾淨
      const toolbar = document.querySelector('.toolbar');
      const originalToolbarDisplay = toolbar.style.display;
      
      html2canvas(targetArea, {
        scale: 2, // 高解析度
        useCORS: true,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        const imageURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `Capacity_Roadmap圖鑑表_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = imageURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }).catch(err => {
        console.error(err);
        alert('匯出 Capacity Roadmap 圖片失敗：' + err.message);
      });
    };

    window.openAnalysisModal = function() {
      document.getElementById('analysis-modal').style.display = 'flex';
      renderChart();
    };

    window.closeAnalysisModal = function() {
      document.getElementById('analysis-modal').style.display = 'none';
    };

    window.switchChartPage = function(pageId, btnEl) {
      document.querySelectorAll('.chart-page').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.chart-tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      btnEl.classList.add('active');
    };

    const datalabelsStandardConfig = {
      anchor: 'end',
      align: 'top',
      color: '#1e293b',
      font: { weight: 'bold', size: 12 },
      formatter: (val) => val > 0 ? val.toLocaleString() : ''
    };

    function createSampledDataLabelsConfig(totalCount) {
      const maxPoints = 5;
      const sampledIndices = new Set();
      
      if (totalCount <= maxPoints) {
        for (let i = 0; i < totalCount; i++) sampledIndices.add(i);
      } else {
        sampledIndices.add(0);
        sampledIndices.add(totalCount - 1);
        const step = (totalCount - 1) / (maxPoints - 1);
        for (let i = 1; i < maxPoints - 1; i++) {
          sampledIndices.add(Math.round(i * step));
        }
      }

      return {
        anchor: 'end',
        align: (ctx) => (ctx.dataIndex === totalCount - 1 ? 'left' : 'top'),
        offset: 6,
        color: '#1e293b',
        backgroundColor: null,
        borderWidth: 0,
        font: { weight: 'bold', size: 12 },
        formatter: (val, ctx) => {
          if (!sampledIndices.has(ctx.dataIndex)) return '';
          return val.toLocaleString();
        }
      };
    }

    const commonScalesConfig = {
      x: { ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } },
      y: { 
        ticks: { color: '#64748b' }, 
        grid: { color: '#e2e8f0' }, 
        beginAtZero: true,
        grace: '18%'
      }
    };

    function renderChart() {
      const sheet = getActiveSheet();

      const vendorStats = {};
      const vendorPcsStats = {};
      const pendingStats = {};
      const dateDailyMap = {};
      const pendingDailyMap = {};

      sheet.data.forEach(row => {
        const vendor = (row.vendor || "").trim();
        const pendingVendor = (row.faiPendingVendor || "").trim();
        const pcs = parseFloat(row.deliveredPcs) || 0;
        const assignDate = (row.faiAssignDate || "").trim();

        if (vendor) {
          vendorStats[vendor] = (vendorStats[vendor] || 0) + 1;
          vendorPcsStats[vendor] = (vendorPcsStats[vendor] || 0) + pcs;
        }

        if (pendingVendor) {
          pendingStats[pendingVendor] = (pendingStats[pendingVendor] || 0) + 1;
          if (assignDate) {
            pendingDailyMap[assignDate] = (pendingDailyMap[assignDate] || 0) + 1;
          }
        }

        if (assignDate) {
          if (!dateDailyMap[assignDate]) {
            dateDailyMap[assignDate] = { count: 0, pcs: 0 };
          }
          dateDailyMap[assignDate].count += 1;
          dateDailyMap[assignDate].pcs += pcs;
        }
      });

      Object.keys(chartInstances).forEach(key => chartInstances[key]?.destroy());

      chartInstances['vendorCount'] = new Chart(document.getElementById('vendorCountChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(vendorStats),
          datasets: [{ label: '已派工件數', data: Object.values(vendorStats), backgroundColor: '#0284c7' }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: commonScalesConfig,
          plugins: { datalabels: datalabelsStandardConfig }
        }
      });

      chartInstances['vendorPcs'] = new Chart(document.getElementById('vendorPcsChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(vendorPcsStats),
          datasets: [{ label: '已交貨 (PCS)', data: Object.values(vendorPcsStats), backgroundColor: '#059669' }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: commonScalesConfig,
          plugins: { datalabels: datalabelsStandardConfig }
        }
      });

      chartInstances['faiPending'] = new Chart(document.getElementById('faiPendingChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(pendingStats),
          datasets: [{ label: '待驗證件數', data: Object.values(pendingStats), backgroundColor: '#d97706' }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: commonScalesConfig,
          plugins: { datalabels: datalabelsStandardConfig }
        }
      });

      const sortedDates = Object.keys(dateDailyMap).sort();
      const cumulativeCountData = [];
      const cumulativePcsData = [];
      let runningCount = 0;
      let runningPcs = 0;

      sortedDates.forEach(date => {
        runningCount += dateDailyMap[date].count;
        runningPcs += dateDailyMap[date].pcs;
        cumulativeCountData.push(runningCount);
        cumulativePcsData.push(runningPcs);
      });

      const cumulativeDataLabels = createSampledDataLabelsConfig(sortedDates.length);

      chartInstances['dailyCount'] = new Chart(document.getElementById('dailyCountChart'), {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            label: 'FAI已派工逐日累積件數',
            data: cumulativeCountData,
            borderColor: '#0284c7',
            backgroundColor: 'rgba(2, 132, 199, 0.1)',
            pointBackgroundColor: '#0284c7',
            pointRadius: 4,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 40, top: 10 } },
          scales: commonScalesConfig,
          plugins: { datalabels: cumulativeDataLabels }
        }
      });

      chartInstances['dailyPcs'] = new Chart(document.getElementById('dailyPcsChart'), {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            label: 'FAI已派工逐日累積PCS數',
            data: cumulativePcsData,
            borderColor: '#7c3aed',
            backgroundColor: 'rgba(124, 58, 237, 0.1)',
            pointBackgroundColor: '#7c3aed',
            pointRadius: 4,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 40, top: 10 } },
          scales: commonScalesConfig,
          plugins: { datalabels: cumulativeDataLabels }
        }
      });

      const sortedPendingDates = Object.keys(pendingDailyMap).sort();
      const cumulativePendingCountData = [];
      let runningPendingCount = 0;

      sortedPendingDates.forEach(date => {
        runningPendingCount += pendingDailyMap[date];
        cumulativePendingCountData.push(runningPendingCount);
      });

      const pendingCumulativeDataLabels = createSampledDataLabelsConfig(sortedPendingDates.length);

      chartInstances['faiPendingDaily'] = new Chart(document.getElementById('faiPendingDailyChart'), {
        type: 'line',
        data: {
          labels: sortedPendingDates,
          datasets: [{
            label: 'FAI待驗證逐日累積件數',
            data: cumulativePendingCountData,
            borderColor: '#d97706',
            backgroundColor: 'rgba(217, 119, 6, 0.1)',
            pointBackgroundColor: '#d97706',
            pointRadius: 4,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { right: 40, top: 10 } },
          scales: commonScalesConfig,
          plugins: { datalabels: pendingCumulativeDataLabels }
        }
      });
    }

    function renderSheets() {
      const container = document.getElementById('sheets-container');
      container.innerHTML = '';
      workbook.forEach(sheet => {
        const tab = document.createElement('div');
        tab.className = `sheet-tab ${sheet.id === activeSheetId ? 'active' : ''}`;
        tab.innerText = sheet.name;
        tab.onclick = () => {
          activeSheetId = sheet.id;
          renderSheets();
          renderTable();
          checkRoadmapBtnVisibility();
        };
        container.appendChild(tab);
      });
    }

    function checkRoadmapBtnVisibility() {
      const btn = document.getElementById('export-roadmap-btn');
      if (activeSheetId === 'sheet_roadmap') {
        btn.style.display = 'inline-block';
      } else {
        btn.style.display = 'none';
      }
    }

    function renderTable() {
      const sheet = getActiveSheet();
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');

      let headHtml = '<tr>';
      sheet.columns.forEach(col => { headHtml += `<th>${col.label}</th>`; });
      headHtml += '</tr>';
      thead.innerHTML = headHtml;

      tbody.innerHTML = '';
      sheet.data.forEach(row => {
        const tr = document.createElement('tr');
        let bodyHtml = '';
        sheet.columns.forEach(col => {
          bodyHtml += `<td>${row[col.key] || ''}</td>`;
        });
        tr.innerHTML = bodyHtml;
        tbody.appendChild(tr);
      });
    }

    window.exportChartImage = function(canvasId, fileName) {
      const srcCanvas = document.getElementById(canvasId);
      if (!srcCanvas) return;

      Object.values(chartInstances).forEach(chart => chart && chart.update());

      const padding = 20;
      const titleHeight = 40;
      const exportWidth = srcCanvas.width + padding * 2;
      const exportHeight = srcCanvas.height + titleHeight + padding * 2;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = exportWidth;
      exportCanvas.height = exportHeight;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, exportWidth, exportHeight);

      const cardX = padding;
      const cardY = padding;
      const cardWidth = exportWidth - padding * 2;
      const cardHeight = exportHeight - padding * 2;

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(cardX, cardY, cardWidth, cardHeight);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cardX, cardY, cardWidth, cardHeight);

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 18px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(fileName, cardX + 20, cardY + 25);

      const chartDrawX = cardX + 10;
      const chartDrawY = cardY + titleHeight + 5;
      const chartDrawWidth = cardWidth - 20;
      const chartDrawHeight = cardHeight - titleHeight - 15;

      ctx.drawImage(srcCanvas, chartDrawX, chartDrawY, chartDrawWidth, chartDrawHeight);

      const imageURL = exportCanvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `${fileName}_${new Date().toISOString().slice(0, 10)}.png`;
      link.href = imageURL;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    window.exportAllChartsCombined = function() {
      try {
        const pages = document.querySelectorAll('.chart-page');
        const originalDisplays = [];
        pages.forEach((page, idx) => {
          originalDisplays[idx] = page.style.display;
          page.style.display = 'flex';
        });

        Object.values(chartInstances).forEach(chart => {
          if (chart) {
            chart.resize();
            chart.update();
          }
        });

        const chartsConfig = [
          { id: 'vendorCountChart', title: '1. FAI合格已派工-件數' },
          { id: 'vendorPcsChart', title: '2. FAI合格已派工-已交貨PCS' },
          { id: 'faiPendingChart', title: '3. FAI待驗證-件數' },
          { id: 'dailyCountChart', title: '4. FAI已派工逐日累積件數' },
          { id: 'dailyPcsChart', title: '5. FAI已派工逐日累積PCS數' },
          { id: 'faiPendingDailyChart', title: '6. FAI待驗證逐日累積件數' }
        ];

        const combinedCanvas = document.createElement('canvas');
        const singleWidth = 750;
        const singleHeight = 400;
        const padding = 30;
        const headerHeight = 70;

        const cols = 3;
        const rows = 2;

        combinedCanvas.width = cols * singleWidth + (cols + 1) * padding;
        combinedCanvas.height = headerHeight + rows * singleHeight + (rows + 1) * padding;

        const ctx = combinedCanvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);

        ctx.fillStyle = '#0284c7';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('衛星工廠進度追蹤總覽分析報告', combinedCanvas.width / 2, 45);

        chartsConfig.forEach((item, index) => {
          const srcCanvas = document.getElementById(item.id);
          if (!srcCanvas || srcCanvas.width === 0 || srcCanvas.height === 0) return;

          const col = index % cols;
          const row = Math.floor(index / cols);

          const x = padding + col * (singleWidth + padding);
          const y = headerHeight + padding + row * (singleHeight + padding);

          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(x, y, singleWidth, singleHeight);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(x, y, singleWidth, singleHeight);

          ctx.fillStyle = '#1e293b';
          ctx.font = 'bold 16px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(item.title, x + 16, y + 30);

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = srcCanvas.width;
          tempCanvas.height = srcCanvas.height;
          const tempCtx = tempCanvas.getContext('2d');

          tempCtx.fillStyle = '#f8fafc';
          tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
          tempCtx.drawImage(srcCanvas, 0, 0);

          const chartDrawY = y + 40;
          const chartDrawHeight = singleHeight - 50;
          ctx.drawImage(tempCanvas, x + 10, chartDrawY, singleWidth - 20, chartDrawHeight);
        });

        pages.forEach((page, idx) => {
          page.style.display = originalDisplays[idx];
        });

        const imageURL = combinedCanvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `衛星工廠進度追蹤_6合1分析報告_${new Date().toISOString().slice(0,10)}.png`;
        link.href = imageURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (err) {
        console.error(err);
        alert('匯出圖表時發生錯誤：' + err.message);
      }
    };

    loadDataFromCloud();
  </script>
