<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Capacity Roadmap & Machine Analytics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
    }

    /* 頂部固定區域 */
    .sticky-header-wrapper {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color);
      padding-top: 8px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }
    .btn-success { background-color: #10b981; color: #fff; border: none; }
    .btn-success:hover { background-color: #059669; color: #fff; }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .btn-danger:hover { background-color: #dc2626; color: #fff; }

    .tab-content {
      display: none;
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    /* 凍結表格標頭 Header：使用容器的邊界進行黏著 */
    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0; /* 配合父層容器固定 */
      z-index: 50;
      user-select: none;
    }

    .th-header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .th-title {
      cursor: pointer;
      flex: 1;
    }
    .th-title:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .btn-del-col {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .btn-del-col:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    body.read-only .btn-del-col { display: none; }

    body:not(.read-only) th.draggable-col { cursor: grab; }
    body:not(.read-only) th.draggable-col:active { cursor: grabbing; }

    td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

    .drag-handle {
      cursor: grab;
      color: var(--text-muted);
      font-size: 1rem;
      text-align: center;
      width: 30px;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    body.read-only .drag-handle { display: none; }

    .drag-over-row { border-top: 2px solid var(--accent) !important; }
    .drag-over-col { border-left: 2px solid var(--accent) !important; }

    .material-header {
      font-weight: 800;
      color: var(--accent);
      background-color: rgba(15, 23, 42, 0.5);
      vertical-align: middle;
      border-right: 1px solid var(--border-color);
    }

    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .stat-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-card-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card-value { font-size: 1.6rem; font-weight: 700; color: var(--success); }

    .delta-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .delta-plus { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
    .delta-new { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--accent); }

    body.read-only .editable { cursor: default; }
    body:not(.read-only) .editable { cursor: pointer; }
    body:not(.read-only) .editable:hover {
      background-color: rgba(56, 189, 248, 0.15) !important;
      outline: 1px dashed var(--accent);
    }

    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; }
    body:not(.read-only) .action-btn:hover { color: var(--danger); }
    body.read-only .action-btn { opacity: 0.3; cursor: not-allowed; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 41, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-card h3 { margin-top: 0; margin-bottom: 16px; color: var(--accent); }
    .modal-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.9rem;
    }
    .modal-input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  </style>
</head>
<body class="read-only">

      </div>
    </div>
  </div>

    let roadmapData = initialData;

    const tbody = document.getElementById('table-body');
    const headerRow = document.getElementById('table-header-row');
    const analyticsTbody = document.getElementById('analytics-tbody');
    const authBtn = document.getElementById('auth-btn');
    const authStatus = document.getElementById('auth-status');
    const loginModal = document.getElementById('login-modal');

    // 自動計算頂部固定高度以利精準對齊
    function updateStickyPosition() {
      const headerHeight = document.getElementById('sticky-header').offsetHeight;
      const ths = document.querySelectorAll('th');
      ths.forEach(th => {
        th.style.top = `${headerHeight}px`;
      });
    }

    window.addEventListener('resize', updateStickyPosition);

    const docRef = doc(db, "capacity_roadmap", "main_data");
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        roadmapData = data.list || [];
        if (data.columns) {
          columns = data.columns;
        }
        renderTableHeader();
        renderTable();
        renderAnalytics();
      } else {
        roadmapData = initialData;
        renderTableHeader();
        renderTable();
        renderAnalytics();
      }
    }, (error) => {
      console.warn("Firestore 監聽通知：", error.message);
    });

    async function saveToFirestore(data, cols = columns) {
      if (!auth.currentUser) {
        alert("請先進行管理員登入，才能將資料同步至雲端！");
        return;
      }
      try {
        await setDoc(docRef, { list: data, columns: cols });
      } catch (e) {
        console.error("雲端同步失敗: ", e);
        alert(`資料儲存至雲端失敗：${e.message}`);
      }
    }

    window.switchTab = (tabId, e) => {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      e.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'analytics-tab') {
        renderAnalytics();
      }
      setTimeout(updateStickyPosition, 50);
    };

    function renderTableHeader() {
      headerRow.innerHTML = '<th style="width: 35px;" class="no-drag"></th>';
      
      columns.forEach((col, index) => {
        const th = document.createElement('th');
        th.style.width = col.width || 'auto';

        const container = document.createElement('div');
        container.className = 'th-header-content';

        const titleSpan = document.createElement('span');
        titleSpan.className = 'th-title';
        titleSpan.innerText = col.label;
        titleSpan.title = "雙擊此處修改欄位名稱";
        titleSpan.ondblclick = () => editColumnName(index);

        container.appendChild(titleSpan);

        if (col.key !== 'material' && col.key !== 'process' && col.key !== 'action') {
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-del-col';
          delBtn.innerText = '🗑️';
          delBtn.title = '刪除此欄位';
          delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteColumn(index);
          };
          container.appendChild(delBtn);
        }

        th.appendChild(container);

        if (!col.noDrag) {
          th.classList.add('draggable-col');
          if (auth.currentUser) {
            th.draggable = true;
            th.addEventListener('dragstart', (e) => handleColDragStart(e, index));
            th.addEventListener('dragover', handleColDragOver);
            th.addEventListener('drop', (e) => handleColDrop(e, index));
            th.addEventListener('dragleave', handleColDragLeave);
          }
        } else {
          th.style.textAlign = 'center';
        }
        headerRow.appendChild(th);
      });

      setTimeout(updateStickyPosition, 10);
    }

    window.editColumnName = (index) => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能修改欄位名稱！");
        return;
      }
      const oldLabel = columns[index].label;
      const newLabel = prompt("請輸入新的欄位名稱：", oldLabel);
      if (newLabel !== null && newLabel.trim() !== "") {
        columns[index].label = newLabel.trim();
        saveToFirestore(roadmapData, columns);
      }
    };

    document.getElementById('add-col-btn').onclick = () => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能新增欄位！");
        return;
      }
      const colLabel = prompt("請輸入新欄位名稱 (例如：2027 預估)：", "新欄位");
      if (!colLabel) return;

      const colKey = 'col_' + Date.now();
      const actionIndex = columns.findIndex(c => c.key === 'action');
      const newColObj = { key: colKey, label: colLabel.trim(), width: '15%' };

      if (actionIndex !== -1) {
        columns.splice(actionIndex, 0, newColObj);
      } else {
        columns.push(newColObj);
      }

      saveToFirestore(roadmapData, columns);
    };

    window.deleteColumn = (index) => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能刪除欄位！");
        return;
      }
      const col = columns[index];
      if (confirm(`確定要刪除欄位「${col.label}」嗎？這將會清除所有資料列中該欄位的數據！`)) {
        columns.splice(index, 1);
        saveToFirestore(roadmapData, columns);
      }
    };

    let draggedColIndex = null;
    function handleColDragStart(e, index) {
      draggedColIndex = index;
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleColDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      e.currentTarget.classList.add('drag-over-col');
      return false;
    }
    function handleColDragLeave(e) {
      e.currentTarget.classList.remove('drag-over-col');
    }
    function handleColDrop(e, targetIndex) {
      e.stopPropagation();
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-col');

      if (draggedColIndex !== null && draggedColIndex !== targetIndex) {
        const movedCol = columns.splice(draggedColIndex, 1)[0];
        columns.splice(targetIndex, 0, movedCol);
        renderTableHeader();
        renderTable();
        saveToFirestore(roadmapData, columns);
      }
      draggedColIndex = null;
      return false;
    }

    function renderTable() {
      tbody.innerHTML = '';

      const materialSpanMap = [];
      let i = 0;
      while (i < roadmapData.length) {
        const currentMat = roadmapData[i].material || '';
        let span = 1;
        while (i + span < roadmapData.length && (roadmapData[i + span].material || '') === currentMat) {
          span++;
        }
        materialSpanMap[i] = span;
        for (let j = 1; j < span; j++) {
          materialSpanMap[i + j] = 0;
        }
        i += span;
      }

      roadmapData.forEach((row, index) => {
        const tr = document.createElement('tr');

        if (auth.currentUser) {
          tr.draggable = true;
          tr.addEventListener('dragstart', (e) => handleRowDragStart(e, index));
          tr.addEventListener('dragover', handleRowDragOver);
          tr.addEventListener('drop', (e) => handleRowDrop(e, index));
          tr.addEventListener('dragleave', handleRowDragLeave);
        }

        const handleTd = document.createElement('td');
        handleTd.className = 'drag-handle';
        handleTd.innerHTML = '⋮⋮';
        tr.appendChild(handleTd);

        columns.forEach(col => {
          if (col.key === 'material') {
            const span = materialSpanMap[index];
            if (span > 0) {
              const td = document.createElement('td');
              td.className = 'editable material-header';
              td.rowSpan = span;
              td.innerText = row.material || '-';
              td.ondblclick = () => editMaterialCategory(index);
              tr.appendChild(td);
            }
          } else if (col.key === 'action') {
            const td = document.createElement('td');
            td.style.textAlign = 'center';
            td.innerHTML = `<button class="action-btn" onclick="deleteRow(${index})" title="刪除此行">🗑️</button>`;
            tr.appendChild(td);
          } else {
            const td = document.createElement('td');
            td.className = 'editable';
            td.innerText = row[col.key] || '-';
            td.ondblclick = () => editCell(index, col.key);
            tr.appendChild(td);
          }
        });

        tbody.appendChild(tr);
      });
    }

    let draggedRowIndex = null;
    function handleRowDragStart(e, index) {
      draggedRowIndex = index;
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleRowDragOver(e) {
      if (e.preventDefault) e.preventDefault();
      e.currentTarget.classList.add('drag-over-row');
      return false;
    }
    function handleRowDragLeave(e) {
      e.currentTarget.classList.remove('drag-over-row');
    }
    function handleRowDrop(e, targetIndex) {
      e.stopPropagation();
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over-row');

      if (draggedRowIndex !== null && draggedRowIndex !== targetIndex) {
        const movedRow = roadmapData.splice(draggedRowIndex, 1)[0];
        roadmapData.splice(targetIndex, 0, movedRow);
        renderTable();
        saveToFirestore(roadmapData, columns);
      }
      draggedRowIndex = null;
      return false;
    }

    function renderAnalytics() {
      analyticsTbody.innerHTML = '';
      let exp2026Count = 0;
      let exp20262hCount = 0;

      roadmapData.forEach(row => {
        const isChanged2026 = row.y2026 && row.y2026 !== row.y2025;
        const isChanged20262h = row.y2026_2h && row.y2026_2h !== row.y2026;

        if (isChanged2026 || isChanged20262h || !row.y2025) {
          if (isChanged2026) exp2026Count++;
          if (isChanged20262h) exp20262hCount++;

          let badgeHtml = '';
          if (!row.y2025 && (row.y2026 || row.y2026_2h)) {
            badgeHtml = `<span class="delta-badge delta-new">✨ 全新導入機台</span>`;
          } else {
            badgeHtml = `<span class="delta-badge delta-plus">📈 產能擴充/異動</span>`;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight: 700; color: var(--accent);">${row.material || ''}</td>
            <td><strong>${row.process || ''}</strong></td>
            <td>${row.y2025 || '<span style="color:var(--text-muted);">無 (0)</span>'}</td>
            <td style="color: ${isChanged2026 ? '#38bdf8' : 'inherit'}; font-weight: ${isChanged2026 ? '700' : 'normal'};">${row.y2026 || '-'}</td>
            <td style="color: ${isChanged20262h ? '#34d399' : 'inherit'}; font-weight: ${isChanged20262h ? '700' : 'normal'};">${row.y2026_2h || '-'}</td>
            <td>${badgeHtml}</td>
          `;
          analyticsTbody.appendChild(tr);
        }
      });

      document.getElementById('stat-2026-exp').innerText = `${exp2026Count} 項機台擴增`;
      document.getElementById('stat-20262h-exp').innerText = `${exp20262hCount} 項機台擴增`;
    }

    document.getElementById('export-image-btn').onclick = () => {
      const exportArea = document.getElementById('analytics-export-area');
      const exportBtn = document.getElementById('export-image-btn');

      exportBtn.innerText = "⏳ 圖片生成中...";
      exportBtn.disabled = true;

      html2canvas(exportArea, { backgroundColor: '#1e293b', scale: 2 }).then(canvas => {
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.href = image;
        link.download = `Capacity_Delta_Analytics_${new Date().toISOString().slice(0,10)}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        exportBtn.innerText = "📸 匯出分析圖表圖片 (PNG)";
        exportBtn.disabled = false;
      }).catch(err => {
        alert("匯出圖片失敗：" + err);
        exportBtn.innerText = "📸 匯出分析圖表圖片 (PNG)";
        exportBtn.disabled = false;
      });
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.body.classList.remove("read-only");
        authStatus.innerText = `已登入 (${user.email})`;
        authBtn.innerText = "登出";
        authBtn.classList.remove("btn-primary");
        authBtn.classList.add("btn-danger");
      } else {
        document.body.classList.add("read-only");
        authStatus.innerText = "狀態：唯讀模式";
        authBtn.innerText = "管理員登入";
        authBtn.classList.remove("btn-danger");
        authBtn.classList.add("btn-primary");
      }
      renderTableHeader();
      renderTable();
    });

    authBtn.onclick = async () => {
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        loginModal.style.display = 'flex';
      }
    };

    document.getElementById('cancel-login-btn').onclick = () => {
      loginModal.style.display = 'none';
    };

    const doLogin = async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert("請輸入 Email 與密碼！");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginModal.style.display = 'none';
        document.getElementById('login-email').value = '';
        document.getElementById('login-password').value = '';
      } catch (err) {
        alert("登入失敗：帳號或密碼錯誤！(" + err.message + ")");
      }
    };

    document.getElementById('do-login-btn').onclick = doLogin;
    document.getElementById('login-password').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    window.editMaterialCategory = (index) => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能修改資料！");
        return;
      }

      const oldVal = roadmapData[index].material || '';
      const newVal = prompt("請輸入新的 Material 類別名稱：", oldVal);
      if (newVal !== null && newVal.trim() !== "") {
        roadmapData[index].material = newVal.trim();
        saveToFirestore(roadmapData, columns);
      }
    };

    window.editCell = (index, key) => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能修改資料！");
        return;
      }

      const colObj = columns.find(c => c.key === key);
      const label = colObj ? colObj.label : key;

      const currentVal = roadmapData[index][key] || '';
      const newVal = prompt(`修改 ${label}：`, currentVal);

      if (newVal !== null) {
        roadmapData[index][key] = newVal.trim();
        saveToFirestore(roadmapData, columns);
      }
    };

    window.deleteRow = (index) => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能刪除資料！");
        return;
      }

      if (confirm(`確定要刪除「${roadmapData[index].process || '此筆資料'}」這一列嗎？`)) {
        roadmapData.splice(index, 1);
        saveToFirestore(roadmapData, columns);
      }
    };

    document.getElementById('add-row-btn').onclick = () => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能新增資料！");
        return;
      }

      const material = prompt("請輸入 Material 類別 (例如 Metal: AL/SST, Graphite 等)：", "Metal: AL/SST");
      if (!material) return;
      const process = prompt("請輸入 Process / Machine 名稱：", "New Machine");
      if (!process) return;

      roadmapData.push({
        material: material.trim(),
        process: process.trim(),
        y2025: "0",
        y2026: "0",
        y2026_2h: "0"
      });

      saveToFirestore(roadmapData, columns);
    };

    document.getElementById('export-json-btn').onclick = () => {
      const exportObj = { columns, list: roadmapData };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Capacity_Roadmap_Backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    const importBtn = document.getElementById('import-btn');
    const importFileInput = document.getElementById('import-file-input');

    importBtn.onclick = () => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能匯入備份！");
        return;
      }
      importFileInput.click();
    };

    importFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            roadmapData = imported;
          } else if (imported.list) {
            roadmapData = imported.list;
            if (imported.columns) columns = imported.columns;
          } else {
            alert("格式不符！請上傳正確的 Roadmap JSON 檔案。");
            return;
          }
          saveToFirestore(roadmapData, columns);
          alert("JSON 資料成功匯入雲端！");
        } catch (err) {
          alert("無法讀取此 JSON 檔案！");
        }
        importFileInput.value = '';
      };
      reader.readAsText(file);
    };

    const importCsvBtn = document.getElementById('import-csv-btn');
    const importCsvInput = document.getElementById('import-csv-input');

    importCsvBtn.onclick = () => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能匯入 CSV！");
        return;
      }
      importCsvInput.click();
    };

    importCsvInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const text = event.target.result;
          const rows = parseCSV(text);
          if (rows.length < 2) {
            alert("CSV 內容無有效數據！");
            return;
          }

          const headers = rows[0].map(h => h.trim().toLowerCase());
          const matIdx = headers.findIndex(h => h.includes('material'));
          const procIdx = headers.findIndex(h => h.includes('process') || h.includes('machine'));
          const y2025Idx = headers.findIndex(h => h.includes('2025'));
          const y2026Idx = headers.findIndex(h => h.includes('2026') && !h.includes('2h'));
          const y20262hIdx = headers.findIndex(h => h.includes('2026 2h') || h.includes('2026_2h') || h.includes('2h'));

          const parsedList = [];
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0 || (row.length === 1 && !row[0].trim())) continue;

            parsedList.push({
              material: matIdx !== -1 && row[matIdx] ? row[matIdx].trim() : '',
              process: procIdx !== -1 && row[procIdx] ? row[procIdx].trim() : '',
              y2025: y2025Idx !== -1 && row[y2025Idx] ? row[y2025Idx].trim() : '',
              y2026: y2026Idx !== -1 && row[y2026Idx] ? row[y2026Idx].trim() : '',
              y2026_2h: y20262hIdx !== -1 && row[y20262hIdx] ? row[y20262hIdx].trim() : ''
            });
          }

          if (parsedList.length > 0) {
            roadmapData = parsedList;
            saveToFirestore(roadmapData, columns);
            alert(`成功匯入 ${parsedList.length} 筆 CSV 資料！`);
          } else {
            alert("未能成功解析出資料，請確認 CSV 格式。");
          }
        } catch (err) {
          alert("解析 CSV 檔案時出錯：" + err.message);
        }
        importCsvInput.value = '';
      };
      reader.readAsText(file);
    };

    function parseCSV(text) {
      let p = '', c = '', r = [];
      let q = false;
      let row = [''];
      for (let i = 0; i < text.length; i++) {
        c = text[i];
        p = text[i - 1];
        if (c === '"') {
          if (q && text[i + 1] === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            q = !q;
          }
        } else if (c === ',' && !q) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !q) {
          if (c === '\r' && text[i + 1] === '\n') {
            i++;
          }
          r.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        r.push(row);
      }
      return r;
    }

    document.getElementById('reset-btn').onclick = () => {
      if (!auth.currentUser) {
        alert("權限不足：必須登入管理員帳號才能重置資料！");
        return;
      }

      if (confirm("警告：這將會清除雲端上的所有修改，恢復成預設數值與預設欄位！確定要重置嗎？")) {
        roadmapData = [...initialData];
        columns = [
          { key: 'material', label: 'Material', width: '15%' },
          { key: 'process', label: 'Process / Machine', width: '25%' },
          { key: 'y2025', label: '2025', width: '15%' },
          { key: 'y2026', label: '2026', width: '20%' },
          { key: 'y2026_2h', label: '2026 2H', width: '20%' },
          { key: 'action', label: '操作', width: '5%', noDrag: true }
        ];
        saveToFirestore(roadmapData, columns);
      }
    };
  </script>
</body>
</html>
